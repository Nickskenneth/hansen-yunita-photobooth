<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hansen & Yunita · Photo Booth</title>
<meta name="theme-color" content="#2F4A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --leaf: #2F4A3A;
    --moss: #5E7A5A;
    --sage: #B7C7AE;
    --mist: #EEF2EA;
    --petal: #FFFDF8;
    --pollen: #E9B949;
    --ink: #1D2A21;
    --blush: #E7C3B8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--mist);
    color: var(--ink);
    font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  .screen { display: none; min-height: 100%; }
  .screen.on { display: flex; }

  /* Welcome */
  #welcome {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 24px; position: relative; overflow: hidden;
  }
  #welcome .sprig { position: absolute; width: 190px; opacity: .95; pointer-events: none; }
  #welcome .sprig.tl { top: -20px; left: -40px; transform: rotate(8deg); }
  #welcome .sprig.br { bottom: -24px; right: -44px; transform: rotate(188deg); }
  .names {
    font-family: "Marcellus", Georgia, serif; font-weight: 400;
    font-size: clamp(44px, 13vw, 72px); line-height: 1.02; color: var(--leaf);
    margin: 0 0 14px; letter-spacing: .01em;
  }
  .names .amp { display: block; font-size: .5em; color: var(--moss); margin: 6px 0; }
  .date { font-size: 16px; color: var(--moss); margin: 0 0 36px; letter-spacing: .06em; }
  .lede { max-width: 30ch; margin: 0 auto 32px; color: #3c4a40; }

  button {
    font: 700 17px/1 "Nunito Sans", system-ui, sans-serif;
    border: 0; border-radius: 999px; padding: 18px 30px; cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--pollen); outline-offset: 3px; }
  .primary { background: var(--leaf); color: var(--petal); }
  .primary:active { background: #243a2d; }
  .quiet { background: transparent; color: var(--leaf); box-shadow: inset 0 0 0 2px var(--sage); }
  button:disabled { opacity: .5; cursor: default; }

  /* Camera */
  #camera { flex-direction: column; background: var(--leaf); height: 100%; }
  .viewfinder { position: relative; flex: 1; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video.mirror { transform: scaleX(-1); }
  .count {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Marcellus", Georgia, serif; font-size: 34vw; color: var(--petal);
    text-shadow: 0 4px 30px rgba(0,0,0,.35); pointer-events: none;
  }
  .shotlabel {
    position: absolute; top: 14px; left: 0; right: 0; text-align: center;
    color: var(--petal); font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .thumbs { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 8px; }
  .thumbs img { width: 54px; height: 40px; object-fit: cover; border-radius: 6px; border: 2px solid var(--petal); }
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .controls .quiet { color: var(--petal); box-shadow: inset 0 0 0 2px var(--moss); padding: 14px 18px; font-size: 15px; }
  .shutter {
    width: 78px; height: 78px; padding: 0; border-radius: 50%;
    background: var(--petal); box-shadow: 0 0 0 5px var(--leaf), 0 0 0 8px var(--petal);
  }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .flash.on { opacity: 1; transition: none; }
  .camerr { color: var(--petal); padding: 28px; text-align: center; margin: auto; max-width: 34ch; }

  /* Review */
  #review { flex-direction: column; align-items: center; padding: 24px 20px 40px; gap: 20px; }
  #review h2 { font-family: "Marcellus", Georgia, serif; font-weight: 400; font-size: 28px; color: var(--leaf); margin: 4px 0 0; }
  .strip { width: min(78vw, 300px); height: auto; border-radius: 4px; box-shadow: 0 10px 30px rgba(47,74,58,.22); }
  .form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  label { font-weight: 600; font-size: 15px; color: var(--leaf); }
  input, textarea {
    width: 100%; font: 400 16px/1.4 "Nunito Sans", system-ui, sans-serif; color: var(--ink);
    border: 2px solid var(--sage); background: var(--petal); border-radius: 12px; padding: 12px 14px; margin-top: 6px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--moss); }
  textarea { min-height: 84px; resize: vertical; }
  .actions { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .status { min-height: 1.5em; text-align: center; font-weight: 600; color: var(--leaf); margin: 0; }
  .status.err { color: #9a3b2c; }
  .hint { font-size: 14px; color: var(--moss); text-align: center; margin: 0; max-width: 34ch; }

  @media (prefers-reduced-motion: reduce) { .flash { transition: none; } }
</style>
</head>
<body>

<section id="welcome" class="screen on" aria-labelledby="title">
  <svg class="sprig tl" viewBox="0 0 200 200" aria-hidden="true"><use href="#sprig"/></svg>
  <svg class="sprig br" viewBox="0 0 200 200" aria-hidden="true"><use href="#sprig"/></svg>
  <h1 class="names" id="title">Hansen<span class="amp">&amp;</span>Yunita</h1>
  <p class="date">17 October 2026</p>
  <p class="lede">Take three photos and we'll turn them into a photo strip for you and for the couple's album.</p>
  <button class="primary" id="startBtn">Start the photo booth</button>
</section>

<section id="camera" class="screen" aria-label="Camera">
  <div class="viewfinder">
    <video id="video" playsinline muted autoplay class="mirror"></video>
    <div class="shotlabel" id="shotLabel">Get ready</div>
    <div class="count" id="count" aria-live="assertive"></div>
    <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="controls">
    <button class="quiet" id="backBtn">Back</button>
    <button class="shutter" id="shutterBtn" aria-label="Take 3 photos"></button>
    <button class="quiet" id="flipBtn">Flip</button>
  </div>
</section>

<section id="review" class="screen" aria-labelledby="reviewTitle">
  <h2 id="reviewTitle">Your photo strip</h2>
  <img class="strip" id="stripImg" alt="Your photo strip">
  <div class="form">
    <label>Your name (optional)
      <input id="guestName" maxlength="40" autocomplete="name">
    </label>
    <label>A message for Hansen &amp; Yunita (optional)
      <textarea id="guestMsg" maxlength="280"></textarea>
    </label>
  </div>
  <div class="actions">
    <button class="primary" id="sendBtn">Send to the couple's album</button>
    <p class="status" id="status" role="status"></p>
    <button class="quiet" id="saveBtn">Save to my phone</button>
    <button class="quiet" id="retakeBtn">Take new photos</button>
  </div>
  <p class="hint">If saving doesn't start, press and hold the photo strip to save it.</p>
</section>

<div class="flash" id="flash"></div>

<!-- Botanical sprig, reused on the welcome screen -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="sprig">
      <path d="M20 190 C60 140 90 100 170 30" stroke="#5E7A5A" stroke-width="3" fill="none"/>
      <path d="M60 145 C40 120 45 95 70 88 C80 110 78 130 60 145Z" fill="#5E7A5A"/>
      <path d="M85 115 C95 90 120 82 140 95 C120 112 105 118 85 115Z" fill="#2F4A3A"/>
      <path d="M105 88 C92 64 100 44 124 40 C128 62 120 78 105 88Z" fill="#B7C7AE"/>
      <path d="M40 168 C62 170 78 156 80 138 C60 138 46 150 40 168Z" fill="#2F4A3A"/>
      <g transform="translate(160 40)">
        <g fill="#FFFDF8" stroke="#E7C3B8" stroke-width="1.5">
          <ellipse rx="9" ry="20" transform="rotate(0) translate(0 -16)"/>
          <ellipse rx="9" ry="20" transform="rotate(72) translate(0 -16)"/>
          <ellipse rx="9" ry="20" transform="rotate(144) translate(0 -16)"/>
          <ellipse rx="9" ry="20" transform="rotate(216) translate(0 -16)"/>
          <ellipse rx="9" ry="20" transform="rotate(288) translate(0 -16)"/>
        </g>
        <circle r="8" fill="#E9B949"/>
      </g>
    </g>
  </defs>
</svg>

<script>
(() => {
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzbLQkEyyd7aJXjafC6FZXPVSHr0cjvAhUeN6dErXVRQ5XHVhiKzK33oFmh6AqOrotM/exec";
  const UPLOAD_KEY = "hu-17okt2026-kebun";
  const SHOTS = 3;
  const C = { leaf: "#2F4A3A", moss: "#5E7A5A", sage: "#B7C7AE", mist: "#EEF2EA", petal: "#FFFDF8", pollen: "#E9B949", blush: "#E7C3B8" };

  const $ = (id) => document.getElementById(id);
  const video = $("video");
  let stream = null, facing = "user", busy = false, photos = [], stripBlob = null, stripDataUrl = "", sent = false;

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
    window.scrollTo(0, 0);
  }

  async function startCamera() {
    stopCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1440 }, height: { ideal: 1080 } }, audio: false
      });
      video.srcObject = stream;
      video.classList.toggle("mirror", facing === "user");
      await video.play().catch(() => {});
      return true;
    } catch (e) {
      const vf = document.querySelector(".viewfinder");
      vf.innerHTML = '<p class="camerr">The camera is blocked. Allow camera access for this page in your browser settings, then reload the page.</p>';
      $("shutterBtn").disabled = true;
      return false;
    }
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function grabFrame() {
    // Crop the live video to 4:3 and keep the mirror the guest saw.
    const vw = video.videoWidth, vh = video.videoHeight;
    const target = 4 / 3;
    let sw = vw, sh = vw / target;
    if (sh > vh) { sh = vh; sw = vh * target; }
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    const c = document.createElement("canvas");
    c.width = 1200; c.height = 900;
    const x = c.getContext("2d");
    if (facing === "user") { x.translate(c.width, 0); x.scale(-1, 1); }
    x.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  async function runSequence() {
    if (busy || !stream) return;
    busy = true; photos = [];
    $("thumbs").innerHTML = "";
    $("shutterBtn").disabled = true; $("flipBtn").disabled = true; $("backBtn").disabled = true;
    for (let i = 0; i < SHOTS; i++) {
      $("shotLabel").textContent = "Photo " + (i + 1) + " of " + SHOTS;
      for (let n = 3; n > 0; n--) { $("count").textContent = n; await wait(900); }
      $("count").textContent = "";
      $("flash").classList.add("on");          // bright screen helps front cameras in low light
      await wait(120);
      const frame = grabFrame();
      photos.push(frame);
      $("flash").classList.remove("on");
      const t = new Image(); t.src = frame.toDataURL("image/jpeg", .5); t.alt = "";
      $("thumbs").appendChild(t);
      await wait(700);
    }
    $("shotLabel").textContent = "Making your strip…";
    await buildStrip();
    stopCamera();
    busy = false;
    $("shutterBtn").disabled = false; $("flipBtn").disabled = false; $("backBtn").disabled = false;
    sent = false;
    $("status").textContent = ""; $("status").classList.remove("err");
    $("sendBtn").disabled = false; $("sendBtn").textContent = "Send to the couple's album";
    show("review");
  }

  // --- Strip drawing -------------------------------------------------------
  function leaf(x, ctx, cx, cy, len, ang, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * .3, -len * .28, len * .75, -len * .22, len, 0);
    ctx.bezierCurveTo(len * .75, len * .22, len * .3, len * .28, 0, 0);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,253,248,.35)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(len * .08, 0); ctx.lineTo(len * .9, 0); ctx.stroke();
    ctx.restore();
  }
  function frangipani(ctx, cx, cy, r, rot) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    for (let i = 0; i < 5; i++) {
      ctx.save(); ctx.rotate(i * Math.PI * 2 / 5);
      ctx.beginPath(); ctx.ellipse(r * .35, -r * .55, r * .38, r * .72, .5, 0, Math.PI * 2);
      ctx.fillStyle = C.petal; ctx.fill();
      ctx.strokeStyle = C.blush; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .45);
    g.addColorStop(0, C.pollen); g.addColorStop(1, "rgba(233,185,73,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * .45, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function sprig(ctx, x, y, scale, flip) {
    ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -scale : scale, scale);
    ctx.strokeStyle = C.moss; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(60, -40, 120, -60, 210, -70); ctx.stroke();
    leaf(null, ctx, 40, -22, 80, -1.9, C.leaf);
    leaf(null, ctx, 70, -38, 90, -.2, C.moss);
    leaf(null, ctx, 110, -52, 85, -1.7, C.sage);
    leaf(null, ctx, 150, -62, 80, .1, C.leaf);
    leaf(null, ctx, 185, -68, 60, -1.3, C.moss);
    frangipani(ctx, 215, -72, 38, .3);
    frangipani(ctx, 150, -100, 26, 1.1);
    ctx.restore();
  }

  async function buildStrip() {
    try { await document.fonts.load('64px "Marcellus"'); await document.fonts.load('600 26px "Nunito Sans"'); } catch (e) {}
    const W = 800, M = 48, G = 24, PW = W - M * 2, PH = PW * 3 / 4, FOOT = 330;
    const H = M + SHOTS * PH + (SHOTS - 1) * G + FOOT;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");

    x.fillStyle = C.mist; x.fillRect(0, 0, W, H);
    // faint leaf texture in the paper
    x.globalAlpha = .08;
    for (let i = 0; i < 14; i++) leaf(null, x, (i * 137) % W, 60 + (i * 211) % (H - 200), 70, (i * 1.3) % 6.28, C.leaf);
    x.globalAlpha = 1;

    photos.forEach((p, i) => {
      const py = M + i * (PH + G);
      x.fillStyle = C.petal; x.fillRect(M - 6, py - 6, PW + 12, PH + 12);
      x.drawImage(p, M, py, PW, PH);
    });

    // sprigs climbing onto the first and last photo corners
    sprig(x, 10, M + 70, .9, false);
    sprig(x, W - 10, M + 2 * (PH + G) + PH + 40, .95, true);

    const fy = M + SHOTS * PH + (SHOTS - 1) * G;
    x.textAlign = "center"; x.fillStyle = C.leaf;
    x.font = '76px "Marcellus", Georgia, serif';
    x.fillText("Hansen & Yunita", W / 2, fy + 140);
    x.fillStyle = C.moss; x.font = '600 28px "Nunito Sans", system-ui, sans-serif';
    x.fillText("17 October 2026  ·  Bali", W / 2, fy + 196);
    x.strokeStyle = C.sage; x.lineWidth = 2;
    x.beginPath(); x.moveTo(W / 2 - 60, fy + 236); x.lineTo(W / 2 + 60, fy + 236); x.stroke();
    frangipani(x, W / 2, fy + 236, 16, 0);

    stripDataUrl = c.toDataURL("image/jpeg", .88);
    stripBlob = await new Promise((r) => c.toBlob(r, "image/jpeg", .88));
    $("stripImg").src = stripDataUrl;
  }

  // --- Send & save ---------------------------------------------------------
  async function send() {
    if (sent || !stripDataUrl) return;
    const btn = $("sendBtn"), st = $("status");
    btn.disabled = true; st.classList.remove("err"); st.textContent = "Sending…";
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          key: UPLOAD_KEY, image: stripDataUrl,
          name: $("guestName").value.trim(), message: $("guestMsg").value.trim()
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "upload_failed");
      sent = true;
      st.textContent = "Sent to Hansen & Yunita's album. Thank you!";
      btn.textContent = "Sent";
    } catch (e) {
      st.classList.add("err");
      st.textContent = "Couldn't send. Check your internet connection and tap Send again.";
      btn.disabled = false;
    }
  }

  async function save() {
    if (!stripBlob) return;
    const name = "hansen-yunita-photobooth-" + Date.now() + ".jpg";
    const file = new File([stripBlob], name, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Hansen & Yunita photo strip" }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(stripBlob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // --- Wiring --------------------------------------------------------------
  $("startBtn").onclick = async () => { show("camera"); $("shotLabel").textContent = "Tap the button when you're ready"; await startCamera(); };
  $("shutterBtn").onclick = runSequence;
  $("flipBtn").onclick = async () => { facing = facing === "user" ? "environment" : "user"; await startCamera(); };
  $("backBtn").onclick = () => { stopCamera(); show("welcome"); };
  $("sendBtn").onclick = send;
  $("saveBtn").onclick = save;
  $("retakeBtn").onclick = async () => { show("camera"); $("thumbs").innerHTML = ""; $("shotLabel").textContent = "Tap the button when you're ready"; await startCamera(); };
})();
</script>
</body>
</html>
